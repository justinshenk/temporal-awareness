# Long-context probe: DDXPlus accuracy (distributed) vs refusal (low-rank) as
# context fills with medical cases, for the DDXPlus LoRA and base.
# Tests whether the low-rank behavior (refusal) degrades faster than the
# weight-resident task. See tasks/safety_weights_vs_activations.md.

base_model: google/gemma-2-9b-it
adapter_dir: results/lora_icl/adapter
seed: 42

ddxplus:
  dataset: aai530-group6/ddxplus
  split: test
  n_options: 5
  n_filler: 400          # medical cases that fill the context
  n_task_eval: 30        # held-out medical cases for accuracy
  task_offset: 900       # disjoint from filler pool

eval:
  n_harmful: 30
  harmful_offset: 200    # disjoint from direction-fit/eval/capstone harmful slices
  max_new_refusal: 64
  max_new_task: 8

fills: [0.0, 0.45, 0.85]   # context-fill fractions of max_ctx
max_ctx: 8192

output:
  report: results/safety/2026-06-01-long-context-lora.md
