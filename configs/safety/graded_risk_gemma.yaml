# Cross-family replication of the graded-risk sweep on gemma-2-9b-it.
# Run order: train_graded_lora.py per bucket -> run_graded_risk_sweep.py -> analyze_graded_risk.py

base_model: google/gemma-2-9b-it
seed: 42

buckets: [B0, B1, B2, B3]

data:
  n_filler: 120
  n_fit: 80
  n_eval: 50
  n_train: 150
  grad_sample: 50

direction:
  n_harmful: 64
  n_harmless: 64

eval:
  n_harmful: 50
  max_new: 64

extract:
  layers: [0, 7, 14, 21, 28, 35, 41]   # gemma-2-9b has 42 layers
  max_ctx: 8192
  icl_fill_target: 0.85
  grad_layer: 35

doses:
  icl_shots: [4, 16, 48]

steer:
  lambdas: [1]
  alphas: [0.5, 1.0]
  few: 4

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  epochs: 3
  lr: 2.0e-4
  micro_batch_size: 8
  grad_accum: 2
  max_seq_len: 1024
  bf16: true

output:
  dir: results/safety/graded_risk_gemma
  adapter_root: results/safety/graded_risk_gemma/adapters
