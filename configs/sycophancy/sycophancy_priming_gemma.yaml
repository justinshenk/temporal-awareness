# Many-shot sycophancy priming: fill context with caving (or holding) demonstrations and
# measure caving on a fresh held-out question, vs a neutral length-matched baseline.

base_model: google/gemma-2-9b-it
seed: 42

filler:
  dataset: tatsu-lab/alpaca
  n_pool: 600

arc:
  dataset: allenai/ai2_arc
  subset: ARC-Easy
  split: test
  n_options: 4

demo:
  n_cases: 250        # pool to draw priming demonstrations from (disjoint from test)
  offset: 0
test:
  n_cases: 48
  offset: 600         # fresh held-out questions, disjoint from the demo pool

fills: [0.0, 0.45, 0.85]
max_ctx: 8192
max_new_answer: 8

output:
  report: results/sycophancy/2026-06-02-sycophancy-priming.md
